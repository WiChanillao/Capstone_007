name: CI EcoLearn Chile

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Fase 3/ecoscan-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pip-audit
      - name: Pruebas unitarias
        run: python -m pytest -q --cov=main --cov=rutas_db --cov-report=term-missing
      - name: Auditoría de dependencias
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Fase 3/ecoscan-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Fase 3/ecoscan-frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Build
        run: npm run build
      - name: Pruebas unitarias
        run: npm run test:unit
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
